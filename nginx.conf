server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy to the backend over the internal Compose network — the
    # browser only ever talks to this origin, so apiBaseUrl can stay a
    # relative "/api" (no IP baked into the frontend bundle, no CORS).
    location /api/ {
        proxy_pass http://app:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # GET /api/notifications/subscribe is a long-lived SSE stream —
        # buffering would hold chunks until the buffer fills instead of
        # pushing them through immediately, defeating "live" notifications.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
